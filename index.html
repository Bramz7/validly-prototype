<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Validly prototype</title>
<meta name="theme-color" content="#0E7C7B">
<style>
:root{--teal:#0E7C7B;--deep:#0A5352;--tint:#E6F4F3;--mari:#FFB627;--mari-t:#FFF1D1;--ink:#10282B;--slate:#4C6165;--line:#D9E3E2;--canvas:#FAFAF7;--card:#fff;--ok:#1FA463;--warn:#E8890C;--err:#D64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--tint:#12383A;--mari-t:#3A2E10;--ink:#EAF3F2;--slate:#9FB5B3;--line:#254447;--canvas:#0B1A1C;--card:#12292C;--teal:#17A09E}}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:14px/20px system-ui,Roboto,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative}
.note{background:var(--mari-t);color:var(--ink);font-size:12px;line-height:16px;padding:6px 16px;text-align:center}
main{flex:1;overflow-y:auto;padding:16px}
h1{font-size:24px;line-height:32px;margin:0 0 12px;font-weight:800}
.num{font-variant-numeric:tabular-nums}
.hero{background:var(--teal);color:#fff;border-radius:16px;padding:20px}
.hero small{opacity:.85;font-size:12px}
.hero .big{font-size:32px;line-height:40px;font-weight:800;margin:2px 0 6px}
.hero .pf{color:var(--mari);font-weight:700}
.row2{display:flex;gap:12px;margin:12px 0}
.btn{flex:1;height:52px;border-radius:12px;font-weight:700;font-size:16px}
.btn.acc{background:var(--mari);color:#10282B}
.btn.sec{border:1.5px solid var(--teal);color:var(--teal);background:var(--card)}
.btn.pri{background:var(--teal);color:#fff;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li b{display:block}.li span{color:var(--slate);font-size:12px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-ok{background:#DDF3E8;color:#0F6B3E}.b-warn{background:#FCE9CF;color:#8A4A00}
.amt{font-weight:800;font-size:18px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--slate)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--teal);font-weight:700}
.toggle{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.amount{text-align:center;font-size:40px;line-height:48px;font-weight:800;color:var(--teal);margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pad button{height:56px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:700}
.custs{display:flex;flex-wrap:wrap;gap:8px}.custs .chip{flex:none;padding:0 14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10282B;color:#fff;border-radius:12px;padding:12px 16px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ring{display:block;margin:8px auto}
.tip{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:600}
.tip em{font-style:normal;color:var(--teal);font-weight:800}
.empty{color:var(--slate);text-align:center;padding:24px 8px}
.ctr{text-align:center;color:var(--slate)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="note">Prototype with sample data. Nothing you enter is saved.</div>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
var ICON={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',rec:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',debt:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.2-6 6.5-6s5.7 2 6.5 6M17 5a3.5 3.5 0 010 6M19 14c1.6.8 2.6 2.7 3 5"/>',score:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'};
var tabs=[['home','Home'],['rec','Records'],['debt','Debts'],['score','Score']];
var S={tab:'home',sales:[{n:'Rice (2 cups)',a:3500,t:'9:12 am'},{n:'Indomie carton',a:8200,t:'10:40 am'},{n:'Provisions',a:15500,t:'12:05 pm'}],
debts:[{n:'Mama Ngozi',a:12000,d:'3 days'},{n:'Oga Tunde',a:45500,d:'16 days'},{n:'Sister Amina',a:8000,d:'1 day'}],
amt:'',paid:true,cust:null,adding:false};
function fmt(n){return 'NGN '+Number(n).toLocaleString('en-NG')}
function el(id){return document.getElementById(id)}
function toast(t){var x=el('toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},2200)}
function go(t){S.tab=t;S.adding=false;draw()}
function total(){return S.sales.reduce(function(s,x){return s+x.a},0)}
function owed(){return S.debts.reduce(function(s,x){return s+x.a},0)}
function drawNav(){el('nav').innerHTML=tabs.map(function(t){return '<button class="'+(S.tab===t[0]&&!S.adding?'on':'')+'" onclick="go(\''+t[0]+'\')" aria-label="'+t[1]+'"><svg viewBox="0 0 24 24">'+ICON[t[0]]+'</svg>'+t[1]+'</button>'}).join('')}
function home(){var t=total(),ex=9800;return '<div class="hero"><small>Today’s sales</small><div class="big num">'+fmt(t)+'</div><small>Profit <span class="pf num">'+fmt(t-ex)+'</span> after expenses of '+fmt(ex)+'</small></div>'+
'<div class="row2"><button class="btn acc" onclick="openSale()">+ Sale</button><button class="btn sec" onclick="toast(\'Expense screen works the same way\')">+ Expense</button></div>'+
'<div class="card" onclick="go(\'debt\')" style="cursor:pointer"><span style="color:var(--slate)">People owe you</span><div class="amt num">'+fmt(owed())+'</div><span class="badge b-warn">'+S.debts.length+' customers</span></div>'+
'<h2 style="font-size:16px;margin:16px 0 4px">Recent sales</h2><div class="card">'+recent(4)+'</div>'}
function recent(n){if(!S.sales.length)return '<div class="empty">No sales yet. Tap + Sale to record your first one.</div>';return S.sales.slice(-n).reverse().map(function(s){return '<div class="li"><div><b>'+s.n+'</b><span>'+s.t+'</span></div><div class="amt num">'+fmt(s.a)+'</div></div>'}).join('')}
function rec(){return '<h1>Records</h1><div class="card">'+recent(50)+'</div>'}
function debts(){var h='<h1>Who owes me</h1><div class="card" style="background:var(--mari-t)"><span style="color:var(--slate)">Total owed</span><div class="amt num">'+fmt(owed())+'</div></div>';
if(!S.debts.length)return h+'<div class="empty">No debts. When a customer owes you, record the sale as Owing.</div>';
return h+S.debts.map(function(d,i){var late=parseInt(d.d)>14;return '<div class="card"><div class="li" style="border:0;padding:0"><div><b>'+d.n+'</b><span>'+d.d+' ago</span></div><div style="text-align:right"><div class="amt num">'+fmt(d.a)+'</div><span class="badge '+(late?'b-warn':'b-ok')+'">'+(late?'Overdue':'On time')+'</span></div></div>'+
'<div class="row2" style="margin:12px 0 0"><button class="btn pri" style="height:44px" onclick="toast(\'WhatsApp opens with a ready reminder for '+d.n+'\')">Remind</button><button class="btn sec" style="height:44px" onclick="paid('+i+')">Mark paid</button></div></div>'}).join('')}
function paid(i){var d=S.debts.splice(i,1)[0];toast(d.n+' paid '+fmt(d.a)+'. Well done!');draw()}
function score(){var s=72,c=2*Math.PI*54,o=c*(1-s/100);return '<h1>Business health</h1><svg class="ring" width="160" height="160" viewBox="0 0 140 140" role="img" aria-label="Score 72 out of 100"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="70" cy="70" r="54" fill="none" stroke="var(--teal)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+o+'" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" font-size="38" font-weight="800" fill="var(--ink)">72</text></svg><p class="ctr"><b style="color:var(--ink)">Good.</b> Your records look reliable.</p>'+
'<h2 style="font-size:16px;margin:16px 0 8px">Raise your score</h2><div class="tip">Record sales every day <em>+4</em></div><div class="tip">Collect 3 old debts <em>+3</em></div><div class="tip">Log your stock <em>+2</em></div>'+
'<div class="card" style="background:var(--mari-t);border-color:var(--mari)"><b>Loan offers unlock at score 80.</b><div style="color:var(--slate)">Only you decide who sees your records.</div></div>'}
function openSale(){S.adding=true;S.amt='';S.paid=true;S.cust=null;draw()}
function key(k){if(k==='<')S.amt=S.amt.slice(0,-1);else if(S.amt.length<9)S.amt+=k;draw()}
function setPaid(p){S.paid=p;draw()}
function pick(n){S.cust=n;draw()}
function save(){var a=parseInt(S.amt||'0',10);if(!a){toast('Type the amount first');return}
if(!S.paid&&!S.cust){toast('Choose who owes you');return}
S.sales.push({n:S.paid?'Sale':'Sale (owing: '+S.cust+')',a:a,t:'Just now'});
if(!S.paid){var f=S.debts.filter(function(d){return d.n===S.cust})[0];if(f)f.a+=a;else S.debts.push({n:S.cust,a:a,d:'0 days'})}
toast('Sale saved. Well done!');S.adding=false;S.tab='home';draw()}
function sale(){var amt=S.amt?Number(S.amt).toLocaleString('en-NG'):'0';
var h='<h1>Add sale</h1><div class="amount num">NGN '+amt+'</div><div class="toggle"><button class="chip '+(S.paid?'on':'')+'" onclick="setPaid(true)">Paid</button><button class="chip '+(!S.paid?'on':'')+'" onclick="setPaid(false)">Owing</button></div>';
if(!S.paid)h+='<div class="card"><b>Who owes you?</b><div class="custs" style="margin-top:8px">'+['Mama Ngozi','Oga Tunde','Sister Amina','New customer'].map(function(n){return '<button class="chip '+(S.cust===n?'on':'')+'" onclick="pick(\''+n+'\')">'+n+'</button>'}).join('')+'</div></div>';
h+='<div class="pad">'+['1','2','3','4','5','6','7','8','9','00','0','<'].map(function(k){return '<button onclick="key(\''+k+'\')" aria-label="'+(k==='<'?'Delete':k)+'">'+(k==='<'?'⌫':k)+'</button>'}).join('')+'</div><button class="btn pri" onclick="save()">Save sale</button><p class="ctr"><button onclick="go(\'home\')" style="color:var(--teal);font-weight:700;padding:8px">Cancel</button></p>';
return h}
function draw(){var v=S.adding?sale():S.tab==='home'?home():S.tab==='rec'?rec():S.tab==='debt'?debts():score();el('view').innerHTML=v;el('view').scrollTop=0;drawNav()}
draw();
</script>
</body>
</html>
